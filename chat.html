<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Diagnostic — Cloudify Asia</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hero { text-align: center; }
.hero h1 { font-size: 1.6rem; font-weight: 600; color: #fff; }
.hero p { font-size: 0.9rem; color: #718096; margin-top: 0.5rem; }
.hero .hint { margin-top: 1rem; color: #4a5568; }
.hero .hint span { color: #3182ce; }

#chatBtn {
  position: fixed;
  bottom: 30px;
  left: 30px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #3182ce;
  border: none;
  cursor: pointer;
  z-index: 99999;
  font-size: 1.6rem;
  box-shadow: 0 4px 20px rgba(49,130,206,0.5);
  color: white;
}
#chatBtn:hover { background: #2b6cb0; transform: scale(1.05); }

#chatWindow {
  position: fixed;
  bottom: 100px;
  left: 30px;
  width: 370px;
  height: 500px;
  background: #1a1d2e;
  border: 1px solid #2d3748;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  z-index: 99998;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  visibility: hidden;
  opacity: 0;
  transition: opacity 0.2s, visibility 0.2s;
}
#chatWindow.open { visibility: visible; opacity: 1; }

.chat-header { padding: 1rem 1.25rem; border-bottom: 1px solid #2d3748; display: flex; align-items: center; gap: 0.75rem; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #3182ce; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 0.85rem; flex-shrink: 0; }
.chat-title { font-size: 0.95rem; font-weight: 600; color: #fff; }
.chat-status { font-size: 0.75rem; color: #48bb78; }
.close-btn { margin-left: auto; background: none; border: none; color: #718096; cursor: pointer; font-size: 1.1rem; padding: 0.25rem; }

.messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
.msg { max-width: 85%; padding: 0.65rem 0.9rem; border-radius: 12px; font-size: 0.875rem; line-height: 1.5; }
.msg.ai { background: #2d3748; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.user { background: #3182ce; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.thinking { background: #2d3748; color: #718096; align-self: flex-start; font-style: italic; }
.report-btn { display: inline-block; margin-top: 0.5rem; padding: 0.4rem 0.9rem; background: #276749; color: #9ae6b4; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; width: 100%; text-align: center; }

.input-area { padding: 0.75rem; border-top: 1px solid #2d3748; display: flex; gap: 0.5rem; }
.msg-input { flex: 1; background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; padding: 0.6rem 0.8rem; color: #e2e8f0; font-size: 0.875rem; outline: none; }
.msg-input:focus { border-color: #3182ce; }
.send-btn { background: #3182ce; border: none; border-radius: 8px; width: 38px; height: 38px; cursor: pointer; color: white; font-size: 1.1rem; flex-shrink: 0; }
.send-btn:hover { background: #2b6cb0; }
</style>
</head>
<body>

<div class="hero">
  <h1>DC Deployment Diagnostic Tool</h1>
  <p>AI-powered server deployment checker — Cloudify Asia</p>
  <p class="hint">Click the <span>chat bubble</span> at the bottom left to start</p>
</div>

<button id="chatBtn" onclick="toggleChat()">💬</button>

<div id="chatWindow">
  <div class="chat-header">
    <div class="avatar">AI</div>
    <div>
      <div class="chat-title">DC Assistant</div>
      <div class="chat-status">● Online</div>
    </div>
    <button class="close-btn" onclick="toggleChat()">✕</button>
  </div>
  <div class="messages" id="messages">
    <div class="msg ai">👋 Hi! I am your DC deployment assistant.<br><br>Type <strong>check 192.168.99.143</strong> to run a diagnostic on a server, or just ask me anything.</div>
  </div>
  <div class="input-area">
    <input class="msg-input" id="msgInput" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
    <button class="send-btn" onclick="send()">➤</button>
  </div>
</div>

<script>
const sid = Math.random().toString(36).substr(2,9);
let lastData = null;

function toggleChat() {
  document.getElementById('chatWindow').classList.toggle('open');
  document.getElementById('msgInput').focus();
}

function addMsg(text, type) {
  const box = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  d.innerHTML = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

function addReportBtn(data) {
  const box = document.getElementById('messages');
  const btn = document.createElement('button');
  btn.className = 'report-btn';
  btn.textContent = '📊 View Full Report';
  btn.onclick = () => {
    const p = new URLSearchParams({
      target_ip: data.target_ip||'',
      gateway_ip: data.gateway_ip||'',
      dns_server: data.dns_server||'8.8.8.8',
      username: data.username||'',
      password: data.password||''
    });
    window.open('/report?'+p.toString(),'_blank');
  };
  box.appendChild(btn);
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMsg(msg, 'user');
  const thinking = addMsg('Thinking...', 'thinking');

  const res = await fetch('/chat', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({message: msg, session_id: sid})
  });
  const data = await res.json();
  thinking.remove();
  addMsg(data.reply, 'ai');

  if (data.run_diagnostic && data.data) {
    lastData = data.data;
    const running = addMsg('🔍 Running all checks... please wait (30-60 seconds)', 'thinking');
    const res2 = await fetch('/run_diagnostic', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({...data.data, session_id: sid})
    });
    const d2 = await res2.json();
    running.remove();
    addMsg(d2.reply, 'ai');
    if (d2.show_report_btn) addReportBtn(d2);
  }
}
</script>
</body>
</html>
